spring.application.name=api-gateway
server.port=8085

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# ---------- REST routes (strip /patient, /ordonnance, /remboursement) ----------
spring.cloud.gateway.routes[0].id=ms-patient
spring.cloud.gateway.routes[0].uri=lb://ms-patient
spring.cloud.gateway.routes[0].predicates[0]=Path=/patient/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[1].id=ms-ordonnance
spring.cloud.gateway.routes[1].uri=lb://ms-ordonnance
spring.cloud.gateway.routes[1].predicates[0]=Path=/ordonnance/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[2].id=ms-remboursement
spring.cloud.gateway.routes[2].uri=lb://ms-remboursement
spring.cloud.gateway.routes[2].predicates[0]=Path=/remboursement/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1

# ---------- GraphQL routes (already use SetPath) ----------
spring.cloud.gateway.routes[3].id=ms-patient-graphql
spring.cloud.gateway.routes[3].uri=lb://ms-patient
spring.cloud.gateway.routes[3].predicates[0]=Path=/patient/graphql
spring.cloud.gateway.routes[3].filters[0]=SetPath=/graphql

spring.cloud.gateway.routes[4].id=ms-ordonnance-graphql
spring.cloud.gateway.routes[4].uri=lb://ms-ordonnance
spring.cloud.gateway.routes[4].predicates[0]=Path=/ordonnance/graphql
spring.cloud.gateway.routes[4].filters[0]=SetPath=/graphql

spring.cloud.gateway.routes[5].id=ms-remboursement-graphql
spring.cloud.gateway.routes[5].uri=lb://ms-remboursement
spring.cloud.gateway.routes[5].predicates[0]=Path=/remboursement/graphql
spring.cloud.gateway.routes[5].filters[0]=SetPath=/graphql

logging.level.org.springframework.cloud.gateway=DEBUG